# Local Postgres for Better Auth. `docker compose up -d` to start, `docker compose down` to stop.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: binarygarden
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "binarygarden"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
